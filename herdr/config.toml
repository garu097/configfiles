# herdr configuration
# Symlinked to ~/.config/herdr/config.toml by link_config_for_mac.sh
# Validate with:  herdr config check
# Apply live with: herdr server reload-config

onboarding = false

[theme]
name = "dracula"
auto_switch = false

# ---------------------------------------------------------------------------
# Keybindings — mapped from tmux/tmux.conf
# tmux concept  ->  herdr concept
#   session     ->  workspace
#   window      ->  tab
#   pane        ->  pane
# ---------------------------------------------------------------------------
[keys]
# tmux: set -g prefix C-a
prefix = "ctrl+a"

# --- config / session --------------------------------------------------
reload_config = "prefix+r"          # tmux: bind r source-file
detach        = "prefix+d"          # tmux: prefix d
help          = "prefix+?"          # tmux: prefix ?
settings      = "prefix+shift+s"    # moved off prefix+s (taken by picker)

# --- splits ------------------------------------------------------------
split_vertical   = "prefix+\\"      # tmux: bind '\' split-window -h
split_horizontal = "prefix+-"       # tmux: bind -  split-window -v
close_pane       = "prefix+x"       # tmux: prefix x
zoom             = "prefix+m"       # tmux: bind -r m resize-pane -Z
rename_pane      = "prefix+shift+p"
edit_scrollback  = "prefix+e"
clear_pane       = "prefix+ctrl+k"
copy_mode        = "prefix+["       # tmux: prefix [

# --- pane focus (tmux: vim-tmux-navigator ctrl+h/j/k/l) ----------------
focus_pane_left     = "prefix+h"
focus_pane_down     = "prefix+j"
focus_pane_up       = "prefix+k"
focus_pane_right    = "prefix+l"
cycle_pane_next     = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
last_pane           = "prefix+;"    # tmux: prefix ;

# --- swap panes (tmux: prefix { / }) -----------------------------------
swap_pane_left  = "prefix+{"
swap_pane_right = "prefix+}"
swap_pane_up    = "prefix+shift+k"
swap_pane_down  = "prefix+shift+j"

# --- resize: enter resize mode, then h/j/k/l ---------------------------
# tmux used prefix+h/j/k/l directly; here those focus panes instead.
resize_mode = "prefix+shift+r"

# --- tabs (== tmux windows) --------------------------------------------
new_tab      = "prefix+c"           # tmux: prefix c
rename_tab   = "prefix+,"           # tmux: prefix ,
previous_tab = "prefix+p"           # tmux: prefix p
next_tab     = "prefix+n"           # tmux: prefix n
switch_tab   = "prefix+1..9"        # tmux: prefix 1..9
close_tab    = "prefix+&"           # tmux: prefix &
move_tab_previous = "prefix+shift+left"
move_tab_next     = "prefix+shift+right"

# --- spaces / workspaces (== tmux sessions) ----------------------------
workspace_picker   = "prefix+s"       # tmux: prefix s (choose-tree)
new_workspace      = "prefix+shift+n"
rename_workspace   = "prefix+shift+w" # tmux: prefix $
close_workspace    = "prefix+shift+d"
previous_workspace = "prefix+("       # tmux: prefix ( switch-client -p
next_workspace     = "prefix+)"       # tmux: prefix ) switch-client -n
switch_workspace   = "prefix+shift+1..9"
goto               = "prefix+g"       # navigate mode: up/down = space, hjkl = pane
toggle_sidebar     = "prefix+b"

# --- agents panel (no tmux equivalent) ---------------------------------
previous_agent = "prefix+ctrl+p"
next_agent     = "prefix+ctrl+n"
focus_agent    = "prefix+alt+1..9"

# --- popups (herdr equivalent of tmux display-popup) -------------------

# Cheatsheet of every binding below, rendered from this file.
[[keys.command]]
key = "prefix+/"
type = "popup"
command = "$HOME/.config/herdr/scripts/cheatsheet.sh"
width = "78%"
height = "85%"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"

[ui]
# tmux: set -g status-position bottom
tab_bar_position = "bottom"
# tmux: set -g mouse on
mouse_capture = true

# Agents panel ordering: "spaces" groups by space, "priority" = attention queue.
agent_panel_sort = "spaces"
# "dots" = compact color marks, "symbols" = distinct glyphs per state.
status_indicators = "symbols"

# Replaces the tmux status-right (cpu / memory / clock).
# Commands run on the herdr server through a shell, so $HOME expands.
tab_bar_right_separator = " "
tab_bar_right = [
  { type = "zoom" },
  { type = "text", text = " " },
  { type = "command", command = "$HOME/.config/herdr/scripts/cpu.sh", interval_seconds = 10, timeout_seconds = 5 },
  { type = "text", text = "󰘛 " },
  { type = "command", command = "$HOME/.config/herdr/scripts/memory.sh", interval_seconds = 30, timeout_seconds = 5 },
  { type = "text", text = "󰢗 " },
  { type = "datetime", format = "%d/%m %H:%M" },
]
